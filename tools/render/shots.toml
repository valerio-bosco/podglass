# Shots for tools/render/render.py. Units: cm. Same camera for every case shot so frames match.
# The model is built by model.py (object names: Case_Base, Case_Lid, Case_Hinge, Case_LED, Case_Loop,
# Pod_L, Pod_R).

[render]
engine = "CYCLES"
samples = 64           # --samples overrides (use 16-32 while iterating)
denoise = true
denoiser = "OPTIX"
denoise_passes = "RGB_ALBEDO"
denoise_prefilter = "FAST"
adaptive = true
view_transform = "AgX"
look = "AgX - Medium High Contrast"
exposure = -0.6
open_angle = 100.0     # lid opening in degrees, hinge axis = Case_Lid origin (X axis)

[camera]
lens = 105.0           # mm, long lens = little perspective
azimuth = -24.0        # degrees from the front towards +X (3/4 view)
elevation = 15.0
target = [0.0, 0.0, 2.7]
frame_width = 8.4
tip_tilt = 50.0        # degrees the silicone tips lean towards the center while the pods are in the case      # cm visible across the image at the target distance

[light]                # area lights, positions relative to the target, in cm
key   = { pos = [-14.0, -12.0, 16.0], size = 22.0, energy = 9000.0, color = [1.0, 0.98, 0.95] }
fill  = { pos = [ 18.0, -22.0,  4.0], size = [6.0, 26.0], energy = 4000.0, color = [0.93, 0.95, 1.0] }
strip = { pos = [-20.0, -10.0,  2.0], size = [5.0, 24.0], energy = 2500.0, color = [1.0, 0.97, 0.93] }
rim   = { pos = [  6.0,  16.0,  9.0], size = 14.0, energy = 4500.0, color = [1.0, 1.0, 1.0] }
top   = { pos = [  0.0,  -2.0, 24.0], size = 30.0, energy = 1800.0, color = [1.0, 1.0, 1.0] }
world = { ramp = [0.1, 0.5, 2.5], strength = 0.8 }   # floor / horizon / ceiling grey levels

[shots.case-open]
kind = "anim"
frames = 48
size = [560, 460]
lid = [0.0, 1.0]       # lid fraction of open_angle from first to last frame (smooth ease)
yaw = 0.0
out = "case-open.webp"

[shots.idle]
kind = "anim"
frames = 120
size = [560, 460]
lid = [1.0, 1.0]
yaw = 8.0              # +- degrees, one sine period over the frames (loops, starts at 0)
out = "idle.webp"

[shots.case-closed]
kind = "still"
size = [560, 460]
lid = 0.0
out = "case-closed.png"

[shots.case-small]
kind = "still"
size = [240, 240]
azimuth = 28.0
lid = 0.0
frame_width = 6.9
target = [0.0, 0.0, 2.3]
shadow = false
out = ["case-small.png", "case-small-44.png:44"]

[shots.pod-left]
kind = "still"
size = [240, 240]
only = ["Pod_L"]
place = { Pod_L = { loc = [0.0, 0.0, 2.3], rot = [0.0, 0.0, -35.0] } }
azimuth = 0.0
elevation = 6.0
tip_tilt = 38.0
target = [0.0, 0.0, 1.9]
frame_width = 4.2
shadow = false
out = ["pod-left.png", "pod-left-44.png:44"]

[shots.pod-right]
kind = "still"
size = [240, 240]
only = ["Pod_R"]
place = { Pod_R = { loc = [0.0, 0.0, 2.3], rot = [0.0, 0.0, 35.0] } }
azimuth = 0.0
elevation = 6.0
tip_tilt = 38.0
target = [0.0, 0.0, 1.9]
frame_width = 4.2
shadow = false
out = ["pod-right.png", "pod-right-44.png:44"]

[shots.pods-pair]
kind = "still"
size = [176, 176]
only = ["Pod_L", "Pod_R"]
place = { Pod_L = { loc = [-1.5, 0.0, 2.3], rot = [0.0, 0.0, -30.0] }, Pod_R = { loc = [1.5, 0.0, 2.3], rot = [0.0, 0.0, 30.0] } }
azimuth = 0.0
elevation = 6.0
tip_tilt = 38.0
target = [0.0, 0.0, 1.9]
frame_width = 5.6
shadow = false
out = ["pods-pair.png", "pods-pair-44.png:44"]

# Not part of "all": quick still of the open case for look development (--shot debug-open).
[shots.debug-open]
kind = "still"
debug = true
size = [560, 460]
lid = 1.0
out = "debug-open.png"

[shots.debug-bottom]
kind = "still"
debug = true
size = [560, 460]
lid = 0.0
azimuth = 55.0
elevation = -35.0
target = [0.0, 0.0, 1.5]
shadow = false
out = "debug-bottom.png"

[shots.debug-back]
kind = "still"
debug = true
size = [560, 460]
lid = 1.0
azimuth = 150.0
elevation = 25.0
shadow = false
out = "debug-back.png"
